version: "3.8"

services:
  api:
    build: .
    container_name: api_server
    command: sh -c "sleep 5 && cd src && uvicorn server:app --reload --host=0.0.0.0 --port=3141"
    environment:
      - LOGO_DEV_TOKEN=${LOGO_DEV_TOKEN}
    ports:
      - "3141:3141"
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      - mysql
      - qdrant
      - graphdb
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # Qdrant API port
    volumes:
      - ./qdrant_storage:/qdrant/storage
  graphdb:
    image: neo4j:5.15-community
    container_name: neo4j_graphdb
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j_data/data:/data
      - ./neo4j_data/plugins:/plugins
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_database
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_password
    command:
      - --wait_timeout=3600 # 1 hour idle timeout
      - --interactive_timeout=3600 # 1 hour interactive timeout
      - --net_read_timeout=120 # 2 minutes for reading a block of data
      - --net_write_timeout=120 # 2 minutes for writing a block of data
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  mysql_data:
  ollama_data:
